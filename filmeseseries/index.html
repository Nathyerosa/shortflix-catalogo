<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#d60825" />
    <meta name="description" content="Catálogo leve de filmes e séries separado por tópicos." />
    <title>Shortflix Filmes e Séries</title>
    <link rel="icon" type="image/png" href="favicon.png" />
    <link rel="apple-touch-icon" href="favicon.png" />
    <link rel="stylesheet" href="styles.css" />
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="app.js" defer></script>
  </head>
  <body>
    <main class="app">
      <header class="hero">
        <div class="hero__content">
          <img class="catalog-logo" src="logo-catalog.webp" alt="Shortflix" width="96" height="96" />
          <h1>Shortflix</h1>
          <p>Explore filmes e séries</p>
        </div>
      </header>

      <section class="catalog-shell" aria-label="Catálogo">
        <label class="search-card">
          <span class="visually-hidden">Buscar título</span>
          <input id="search" type="search" placeholder="Buscar..." autocomplete="off" />
        </label>

        <nav id="topic-pills" class="topic-pills" aria-label="Tópicos"></nav>

        <div class="section-heading">
          <span aria-hidden="true">🎟</span>
          <h2 id="section-title">Todos</h2>
        </div>

        <p id="result-count" class="result-count" aria-live="polite">0 título(s)</p>
        <div id="launch-heading" class="subsection-heading" hidden>
          <span aria-hidden="true">▶</span>
          <h3>Lançamentos</h3>
        </div>
        <section id="catalog" class="catalog" aria-label="Títulos"></section>
        <p id="empty" class="empty" hidden>Nenhum título encontrado.</p>
      </section>
    </main>

    <dialog id="details" class="details" aria-labelledby="details-title">
      <div class="details__panel">
        <button id="close-details" class="details__close" type="button" aria-label="Fechar">×</button>
        <div id="details-banner" class="details__banner"></div>
        <div class="details__body">
          <p id="details-type" class="details__type"></p>
          <h2 id="details-title"></h2>
          <p id="details-description"></p>
          <strong id="details-price" class="details__price"></strong>
          <div class="details__actions">
            <button id="trailer-button" class="secondary-button" type="button">Ver trailer</button>
            <button id="buy-button" class="primary-button" type="button">Comprar</button>
          </div>
        </div>
      </div>
    </dialog>
  </body>
</html>
